services:
  # 前端服务
  meridian-frontend:
    build:
      context: ./meridian-frontend
      dockerfile: Dockerfile
    image: meridian-frontend:latest
    container_name: meridian-frontend
    environment:
      TZ: UTC
    ports:
      - "12580:80"
    volumes:
      - ./meridian-frontend/bin/nginx.dockermy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - meridian-backend-my
    networks:
      - meridian-network

  # 后端服务（MySQL版本）
  meridian-backend-my:
    build:
      context: ./meridian-backend
      dockerfile: Dockerfile.my
    image: meridian-backend-my:latest
    container_name: meridian-backend-my
    environment:
      TZ: UTC
    ports:
      - "19099:9099"
    depends_on:
      meridian-mysql:
        condition: service_healthy
      meridian-redis:
        condition: service_healthy
    networks:
      - meridian-network

  # MySQL服务
  meridian-mysql:
    image: m.daocloud.io/docker.io/library/mysql:8.0
    container_name: meridian-mysql
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meridian_admin
    ports:
      - "13306:3306"
    volumes:
      - ./meridian-backend/sql/meridian_admin.sql:/docker-entrypoint-initdb.d/meridian_admin.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    networks:
      - meridian-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  meridian-redis:
    image: m.daocloud.io/docker.io/library/redis:latest
    container_name: meridian-redis
    environment:
      TZ: UTC
    ports:
      - "16379:6379"
    networks:
      - meridian-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  meridian-network:
    name: meridian-network
    driver: bridge
