services:
  # 前端服务
  meridian-frontend:
    build:
      context: ./meridian-frontend
      dockerfile: Dockerfile
    image: meridian-frontend:latest
    container_name: meridian-frontend
    environment:
      TZ: UTC
    ports:
      - "12580:80"
    volumes:
      - ./meridian-frontend/bin/nginx.dockerpg.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - meridian-backend-pg
    networks:
      - meridian-network

  # 后端服务（PostgreSQL版本）
  meridian-backend-pg:
    build:
      context: ./meridian-backend
      dockerfile: Dockerfile.pg
    image: meridian-backend-pg:latest
    container_name: meridian-backend-pg
    environment:
      TZ: UTC
    ports:
      - "19099:9099"
    depends_on:
      meridian-pg:
        condition: service_healthy
      meridian-redis:
        condition: service_healthy
    networks:
      - meridian-network

  # PostgreSQL服务
  meridian-pg:
    image: postgres:14
    container_name: meridian-pg
    environment:
      TZ: UTC
      POSTGRES_PASSWORD: root
      POSTGRES_DB: meridian_admin
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "15432:5432"
    volumes:
      - ./meridian-backend/sql/meridian_admin_pg.sql:/docker-entrypoint-initdb.d/meridian_admin_pg.sql
    networks:
      - meridian-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  meridian-redis:
    image: redis:latest
    container_name: meridian-redis
    environment:
      TZ: UTC
    ports:
      - "16379:6379"
    networks:
      - meridian-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  meridian-network:
    name: meridian-network
    driver: bridge
